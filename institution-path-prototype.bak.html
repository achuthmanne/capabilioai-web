<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Capabilio · Institution Path — Full Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0a08;--bg2:#13100c;--panel:rgba(255,255,255,.05);--card:rgba(255,255,255,.048);--card2:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.16);
  --amber:#dc8b18;--gold:#f6c453;--green:#4fd4a3;--blue:#74a8ff;--purple:#ab93ff;--cyan:#54d9e0;--pink:#ff8db1;--red:#ff8177;--teal:#34d4bf;
  --txt:#f7f2ea;--mut:rgba(247,242,234,.68);--mut2:rgba(247,242,234,.44);
  --shadow:0 24px 70px rgba(0,0,0,.48);
}
html,body{height:100%;}
body{background:radial-gradient(ellipse at top left,rgba(246,196,83,.12),transparent 32%),radial-gradient(ellipse at top right,rgba(116,168,255,.08),transparent 30%),linear-gradient(180deg,#120f0b,#0b0a08 60%);color:var(--txt);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0;}
.serif{font-family:'Instrument Serif',serif;font-style:italic;}
a{color:inherit;text-decoration:none;}button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:6px;}

/* ── TOP BAR ── */
#top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(11,10,8,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);position:relative;z-index:30;}
#top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(246,196,83,.4) 50%,transparent 95%);pointer-events:none;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px;letter-spacing:-.2px;}
.brand .mk{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--amber),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:900;color:#23170a;font-size:16px;box-shadow:0 0 22px rgba(246,196,83,.25),inset 0 1px 0 rgba(255,255,255,.25);}
.brand i{color:var(--gold);font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;}
.brand .sep{width:1px;height:20px;background:var(--line2);margin:0 6px;}
.brand .ist{font-weight:600;font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px;}
.brand .ist-badge{background:rgba(246,196,83,.10);border:1px solid rgba(246,196,83,.22);border-radius:999px;padding:3px 10px;font-size:10px;font-weight:800;color:var(--gold);}
.roleSw{display:flex;gap:3px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:nowrap;overflow-x:auto;max-width:58vw;}
.roleSw button{border:none;background:transparent;color:var(--mut);font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap;transition:.18s;}
.roleSw button.on{background:linear-gradient(135deg,var(--amber),var(--gold));color:#23170a;box-shadow:0 2px 10px rgba(220,139,24,.3);}
.roleSw button:not(.on):hover{color:var(--txt);background:rgba(255,255,255,.05);}
.who{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);white-space:nowrap;}
.who .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10.5px;color:#23170a;}

/* ── SHELL ── */
#shell{display:flex;height:calc(100vh - 60px);position:relative;z-index:1;}

/* ── SIDEBAR ── */
#side{width:246px;flex-shrink:0;background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border-right:1px solid var(--line);padding:8px 0 24px;overflow-y:auto;position:relative;}
.side-head{padding:16px 16px 6px;font-size:8.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,242,234,.3);}
.sgrp{font-size:8.5px;font-weight:800;letter-spacing:.2em;color:rgba(247,242,234,.25);padding:18px 16px 6px;text-transform:uppercase;}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:13px;font-size:12.5px;color:var(--mut);font-weight:600;cursor:pointer;border:1px solid transparent;transition:.14s;}
.nav .ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:9px;background:rgba(255,255,255,.06);flex-shrink:0;transition:.14s;}
.nav:hover{background:rgba(255,255,255,.055);color:var(--txt);}
.nav:hover .ic{background:rgba(255,255,255,.10);}
.nav.on{color:#23170a;background:linear-gradient(135deg,var(--amber),var(--gold));border-color:transparent;box-shadow:0 4px 18px rgba(220,139,24,.22);}
.nav.on .ic{background:rgba(0,0,0,.14);}
.nav .bdg{margin-left:auto;font-size:8.5px;font-weight:900;background:var(--red);color:#fff;border-radius:999px;padding:2px 7px;min-width:18px;text-align:center;box-shadow:0 2px 6px rgba(255,129,119,.4);}
.nav.on .bdg{background:rgba(0,0,0,.22);color:#23170a;box-shadow:none;}
.sidecard{margin:14px 10px 0;background:linear-gradient(135deg,rgba(220,139,24,.08),rgba(171,147,255,.04));border:1px solid rgba(246,196,83,.14);border-radius:14px;padding:12px 13px;}
.sidecard .t{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:5px;}
.sidecard .d{font-size:10px;color:var(--mut);line-height:1.6;}

/* ── MAIN ── */
#main{flex:1;overflow-y:auto;padding:24px 32px 70px;position:relative;}

/* ── SCOPE BAR ── */
.scopebar{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;color:var(--mut2);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin-bottom:22px;}
.scopebar b{color:var(--txt);font-weight:700;}.scopebar .k{color:var(--gold);font-weight:800;}

/* ── PAGE HEADER ── */
.phead{margin-bottom:22px;}
.phead h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;letter-spacing:-.02em;line-height:.94;}
.phead h1 em{color:var(--gold);font-style:inherit;}
.phead p{color:var(--mut);font-size:13px;margin-top:9px;max-width:740px;line-height:1.65;}

/* ── PAGE STAT STRIP ── */
.phead-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:18px 0 22px;}
.phead-stat{background:linear-gradient(180deg,rgba(255,255,255,.048),rgba(255,255,255,.02));padding:16px 18px;}
.phead-stat .psn{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1;}
.phead-stat .psl{font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);margin-top:4px;}
.phead-stat .psd{font-size:10px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:4px;}

/* ── SAE (Signal / Action / Evidence) ── */
.sae{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 22px;}
.saeC{border:1px solid var(--line);border-radius:18px;padding:16px 17px;position:relative;overflow:hidden;}
.saeC::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.saeC .lab{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.saeC .big{font-size:14px;font-weight:800;line-height:1.3;}
.saeC .sm{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.55;}
.saeC.s{background:linear-gradient(160deg,rgba(116,168,255,.07),rgba(255,255,255,.02));border-color:rgba(116,168,255,.24);}.saeC.s::before{background:var(--blue);}.saeC.s .lab{color:var(--blue);}
.saeC.a{background:linear-gradient(160deg,rgba(246,196,83,.08),rgba(255,255,255,.02));border-color:rgba(246,196,83,.26);}.saeC.a::before{background:var(--gold);}.saeC.a .lab{color:var(--gold);}
.saeC.e{background:linear-gradient(160deg,rgba(79,212,163,.07),rgba(255,255,255,.02));border-color:rgba(79,212,163,.24);}.saeC.e::before{background:var(--green);}.saeC.e .lab{color:var(--green);}

/* ── TABS ── */
.tabbar{display:flex;gap:5px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
.tabbar button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:999px;white-space:nowrap;transition:.15s;}
.tabbar button.on{color:#23170a;background:linear-gradient(135deg,var(--amber),var(--gold));border-color:transparent;box-shadow:0 3px 12px rgba(220,139,24,.22);}
.tabbar button:not(.on):hover{color:var(--txt);background:rgba(255,255,255,.05);}

/* ── GRID ── */
.grid{display:grid;gap:13px;}
.g5{grid-template-columns:repeat(5,1fr);}.g4{grid-template-columns:repeat(4,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g2{grid-template-columns:repeat(2,1fr);}

/* ── CARDS ── */
.card{background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.026));border:1px solid var(--line);border-radius:20px;padding:18px;}
.card.hov{transition:.2s;}.card.hov:hover{transform:translateY(-2px);border-color:rgba(246,196,83,.32);box-shadow:var(--shadow);}

/* ── KPI CARD ── */
.kpi .n{font-size:38px;font-weight:900;letter-spacing:-.06em;line-height:1;}
.kpi .l{font-size:9px;color:var(--mut2);margin-top:5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;}
.kpi .d{font-size:10px;margin-top:8px;font-weight:700;display:flex;align-items:center;gap:5px;}
.up{color:var(--green);}.down{color:var(--red);}

/* ── PULSE DOT ── */
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(79,212,163,.6);animation:pl 1.8s infinite;flex-shrink:0;}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(79,212,163,.5)}70%{box-shadow:0 0 0 7px rgba(79,212,163,0)}100%{box-shadow:0 0 0 0 rgba(79,212,163,0)}}

/* ── SECTION HEADERS ── */
.sec{margin:22px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sec h2{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);white-space:nowrap;}
.sec .hl{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);min-width:20px;}
.sec .sub{font-size:11px;color:var(--mut2);}
.sec .badge{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}

/* ── BUTTONS ── */
.btnP{padding:10px 17px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--gold));color:#23170a;font-weight:800;font-size:12.5px;border:none;box-shadow:0 4px 16px rgba(220,139,24,.18);transition:.15s;}
.btnP:hover{box-shadow:0 6px 24px rgba(220,139,24,.35);transform:translateY(-1px);}
.btnG{padding:10px 15px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--txt);font-weight:700;font-size:12.5px;transition:.15s;}
.btnG:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);}
.btnGr{padding:8px 13px;border-radius:10px;background:rgba(79,212,163,.11);border:1px solid rgba(79,212,163,.28);color:var(--green);font-weight:800;font-size:11.5px;}
.btnRd{padding:8px 13px;border-radius:10px;background:rgba(255,129,119,.10);border:1px solid rgba(255,129,119,.28);color:var(--red);font-weight:800;font-size:11.5px;}
.btnXs{padding:6px 12px;border-radius:9px;font-size:11px;font-weight:800;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--txt);transition:.12s;}
.btnXs:hover{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.07);}

/* ── TABLES ── */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line);}
td{padding:12px 14px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.022);}
.tabwrap{border:1px solid var(--line);border-radius:20px;overflow:hidden;overflow-x:auto;background:linear-gradient(180deg,rgba(255,255,255,.042),rgba(255,255,255,.018));}
.tname{display:flex;align-items:center;gap:10px;}
.tav{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#23170a;flex-shrink:0;}
.tnm{font-weight:700;font-size:12.5px;}.tsub{font-size:10.5px;color:var(--mut2);}

/* ── TAGS ── */
.tag{font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.am{background:rgba(246,196,83,.13);color:var(--gold);}.gr{background:rgba(79,212,163,.13);color:var(--green);}.bl{background:rgba(116,168,255,.13);color:var(--blue);}
.pu{background:rgba(171,147,255,.15);color:var(--purple);}.pk{background:rgba(255,141,177,.13);color:var(--pink);}.rd{background:rgba(255,129,119,.13);color:var(--red);}.cy{background:rgba(84,217,224,.13);color:var(--cyan);}.gy{background:rgba(255,255,255,.07);color:var(--mut);}
.risk{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;}
.risk.hi{background:rgba(255,129,119,.13);color:var(--red);}.risk.md{background:rgba(246,196,83,.13);color:var(--gold);}.risk.lo{background:rgba(79,212,163,.13);color:var(--green);}

/* ── MISC ── */
.restrict{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:var(--red);background:rgba(255,129,119,.09);border:1px solid rgba(255,129,119,.25);border-radius:999px;padding:5px 12px;}
.privacy{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:var(--mut2);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
.empty{text-align:center;padding:40px;color:var(--mut2);font-size:12.5px;border:1px dashed var(--line2);border-radius:18px;}

/* ── ROW ITEMS ── */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.048),rgba(255,255,255,.022));margin-bottom:9px;transition:.14s;}
.row:hover{border-color:rgba(255,255,255,.17);background:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.03));}
.row .av{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#23170a;flex-shrink:0;}
.row .nm{font-size:13px;font-weight:700;}.row .mt{font-size:10.5px;color:var(--mut);margin-top:2px;}
.row .right{margin-left:auto;display:flex;align-items:center;gap:8px;}

/* ── BARS ── */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar .nm{font-size:11.5px;width:135px;flex-shrink:0;}
.bar .tk{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;}
.bar .fill{height:100%;border-radius:999px;}
.bar .pc{font-size:11.5px;font-weight:800;width:38px;text-align:right;}

/* ── POSTS ── */
.post{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.026));padding:17px;margin-bottom:12px;}
.post .ph{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.post .ph .av{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#23170a;}
.post .ph .nm{font-size:13.5px;font-weight:800;}.post .ph .mt{font-size:11px;color:var(--mut2);}
.post .ttl{font-size:14.5px;font-weight:800;margin-bottom:5px;}.post .body{font-size:12.5px;color:var(--mut);line-height:1.6;}
.post .media{margin-top:12px;border-radius:14px;height:140px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,rgba(220,139,24,.18),rgba(171,147,255,.12));border:1px solid var(--line);}
.post .doc{margin-top:12px;display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;background:rgba(116,168,255,.08);border:1px solid rgba(116,168,255,.22);}
.post .doc .ic{font-size:22px;}.post .doc .dn{font-size:12.5px;font-weight:700;}.post .doc .ds{font-size:11px;color:var(--mut2);}
.post .pf{display:flex;gap:16px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:11px;color:var(--mut2);font-weight:600;}

#mapwrap{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#1a140a,#0b0a08 72%);height:360px;}
#tmap{position:absolute;inset:0;width:100%;height:100%;}
.liveband{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:rgba(11,10,8,.6);backdrop-filter:blur(8px);border:1px solid rgba(79,212,163,.3);border-radius:999px;padding:6px 13px;font-size:11.5px;color:var(--green);font-weight:700;}

#mob{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
#mob.show{display:flex;}
#modal{width:480px;max-width:100%;max-height:88vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:24px;box-shadow:var(--shadow);}
#modal h3{font-size:18px;font-weight:800;margin-bottom:4px;}#modal .ms{font-size:12px;color:var(--mut);margin-bottom:16px;}
.fld{margin-bottom:13px;}.fld label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:12.5px;font-family:inherit;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);}
.frow{display:flex;gap:10px;}.frow .fld{flex:1;}
#modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;}
.uploadbox{border:1.5px dashed var(--line2);border-radius:12px;padding:20px;text-align:center;color:var(--mut2);font-size:12px;cursor:pointer;}.uploadbox:hover{border-color:var(--gold);color:var(--gold);}
.note{font-size:10.5px;color:var(--gold);background:rgba(220,139,24,.10);border:1px solid rgba(246,196,83,.24);border-radius:10px;padding:9px 11px;margin-bottom:13px;line-height:1.5;}
.flash{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--green),#74e0b8);color:#06281d;font-weight:800;font-size:12.5px;padding:12px 22px;border-radius:999px;z-index:80;opacity:0;transition:.3s;box-shadow:0 14px 40px rgba(79,212,163,.35);}
.flash.show{opacity:1;transform:translateX(-50%) translateY(0);}

#drawer{position:fixed;top:0;right:0;height:100vh;width:430px;max-width:92vw;background:var(--bg2);border-left:1px solid var(--line2);box-shadow:-30px 0 80px rgba(0,0,0,.55);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:55;overflow-y:auto;padding:22px;}
#drawer.show{transform:translateX(0);}
#drawer .dx{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);color:var(--txt);font-size:15px;}
#dscrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.28s;z-index:54;}
#dscrim.show{opacity:1;pointer-events:all;}
.lockwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 20px;}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px;}

.ip-fg-right{position:absolute;inset:0;background:linear-gradient(270deg,rgba(11,10,8,.82) 0%,transparent 50%);z-index:1;}
.ip-hero-left{position:relative;z-index:2;padding:36px 36px 36px 32px;display:flex;flex-direction:column;justify-content:center;}

.ip-nav-bar{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:0 0 20px;}

.ip-ring2{width:200px;height:200px;border:1px dashed rgba(116,168,255,.16);}
.ip-ring3{width:290px;height:290px;border:1px dashed rgba(255,255,255,.07);}

.ip-orbit-core .cn{font-size:22px;font-weight:900;color:var(--gold);line-height:1;}
.ip-orbit-core .cl{font-size:8.5px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}

.ip-orb-node .on-n{font-size:14px;font-weight:900;line-height:1;}
.ip-orb-node .on-l{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.7;line-height:1;margin-top:2px;}

.ip-body{padding:28px 30px 60px;}

/* ===================== UI BUILDERS ===================== */
function page(title,sub,body){
  // Split title on last word to italicise with Instrument Serif for a futuristic mixed-type look
  const parts=title.split(' ');
  const last=parts.pop();
  const h1=(parts.length?parts.join(' ')+' <em>'+last+'</em>':last);
  return '<div class="phead"><h1>'+h1+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+body;
}
function sae(s,a,e){return '<div class="sae"><div class="saeC s"><div class="lab">◆ Status</div><div class="big">'+s[0]+'</div><div class="sm">'+s[1]+'</div></div>'+
  '<div class="saeC a"><div class="lab">▶ Action</div><div class="big">'+a[0]+'</div><div class="sm">'+a[1]+'</div></div>'+
  '<div class="saeC e"><div class="lab">✓ Evidence</div><div class="big">'+e[0]+'</div><div class="sm">'+e[1]+'</div></div></div>';}
function kpi(n,l,col,d,dir){return '<div class="card kpi"><div class="n" style="color:'+col+'">'+n+'</div><div class="l">'+l+'</div>'+(d?'<div class="d '+(dir||'up')+'">'+(dir==='down'?'▼ ':'▲ ')+d+'</div>':'')+'</div>';}
function kpiLive(n,l,col,d){return '<div class="card kpi"><div class="n" style="color:'+col+'">'+n+'</div><div class="l">'+l+'</div><div class="d up"><span class="pulse"></span> '+d+'</div></div>';}
function tabs(page,arr){const a=S.tab[page]||arr[0][0];return '<div class="tabbar">'+arr.map(([k,l])=>'<button class="'+(a===k?'on':'')+'" data-tab="'+page+'|'+k+'">'+l+'</button>').join('')+'</div>';}
function curTab(page,arr){return S.tab[page]||arr[0][0];}
function bars(arr){return arr.map(([n,p,c])=>'<div class="bar"><span class="nm">'+n+'</span><span class="tk"><span class="fill" style="width:'+p+'%;background:'+c+'"></span></span><span class="pc" style="color:'+c+'">'+p+'%</span></div>').join('');}
function tbl(head,rows){return '<div class="tabwrap"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';}
function nameCell(n,sub,col){return '<div class="tname"><div class="tav" style="background:'+grad(col||C.am)+'">'+ini(n)+'</div><div><div class="tnm">'+n+'</div><div class="tsub">'+sub+'</div></div></div>';}
function riskTag(r){return '<span class="risk '+(r==='High'?'hi':r==='Med'?'md':'lo')+'">'+(r==='High'?'⚠ ':'● ')+r+'</span>';}
function mapBlock(){return '<div id="mapwrap"><canvas id="tmap"></canvas><div class="liveband"><span class="pulse"></span> <span id="livetxt">Google is scanning the AI/ML cluster…</span></div></div>';}
function slaTag(st){const m={ok:['gr','● On track'],soon:['am','⏳ Due soon'],breach:['rd','⚠ SLA breached']}[st]||['gy',st];return '<span class="tag '+m[0]+'">'+m[1]+'</span>';}
function stateTag(s){const m={'New':'bl','In Review':'am','Escalated':'rd','Resolved':'gr','Open':'bl','Investigating':'am','Intervention':'pu','Monitoring':'cy','Closed':'gr','Approved':'gr','Pending':'am','Rejected':'rd'}[s]||'gy';return '<span class="tag '+m+'">'+s+'</span>';}
function priTag(p){return '<span class="tag '+(p==='High'?'rd':p==='Med'?'am':'gy')+'">'+p+'</span>';}
function chk(page,id){const on=(S.sel[page]||[]).includes(id);return '<input type="checkbox" '+(on?'checked':'')+' data-act="sel" data-sel="'+page+'" data-id="'+id+'" style="width:15px;height:15px;accent-color:#FBBF24;cursor:pointer">';}
function bulkBar(page,actions){const n=(S.sel[page]||[]).length;if(!n)return '';return '<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:12px;border-color:rgba(251,191,36,.4);background:rgba(217,119,6,.08)"><b style="font-size:13px">'+n+' selected</b>'+actions.map(a=>'<button class="btnXs" data-act="bulk" data-bk="'+a[1]+'" data-sel="'+page+'">'+a[0]+'</button>').join('')+'<button class="btnXs" data-act="bulk" data-bk="clear" data-sel="'+page+'" style="margin-left:auto">Clear</button></div>';}
function chainViz(d){return '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+d.steps.map((s,i)=>{const done=i<d.step,cur=i===d.step;return '<span class="tag '+(done?'gr':cur?'am':'gy')+'">'+(done?'✓ ':cur?'➤ ':'')+s+'</span>'+(i<d.steps.length-1?'<span style="color:var(--mut2)">→</span>':'');}).join('')+'</div>';}

  '<div style="display:flex;gap:7px"><input placeholder="Add a comment…" style="flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:12px"><select style="background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-size:11px;padding:0 6px"><option>Admin only</option><option>Placement + Admin</option><option>All staff</option><option>Recruiter-visible</option></select><button class="btnXs" data-act="addComment">Post</button></div>';}

function renderSearch(){
  const q=SQ.trim().toLowerCase();
  let rows=IDX.filter(r=>(SF==='All'||r[0]===SF)&&(!q||(r[1]+' '+r[2]+' '+r[0]).toLowerCase().includes(q)));
  if(!rows.length)return '<div class=”empty”>No matches'+(q?' for “'+SQ+'”':'')+'. Try a different term or filter.</div>';
  const ICO={Student:'📚',Faculty:'👥',Drive:'🎯',Document:'📄',Case:'🚨',Group:'👨‍👩‍👧',Institution:'🏛️'};
  // Split institutions out for special treatment
  const insts=rows.filter(r=>r[0]==='Institution');
  const rest=rows.filter(r=>r[0]!=='Institution');
  let out='<div class=”mt” style=”font-size:11px;margin-bottom:12px”>'+rows.length+' result'+(rows.length>1?'s':'')+'</div>';
  if(insts.length){
    out+=`<div style=”margin-bottom:16px”><div style=”font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);margin-bottom:10px”>Institutions</div>`;
    out+=insts.map(r=>{
      const isVIT=r[1].toLowerCase().includes('vit');
      return `<div style=”border:1px solid rgba(246,196,83,${isVIT?.35:.18});border-radius:18px;background:linear-gradient(135deg,rgba(220,139,24,${isVIT?.12:.06}),rgba(255,255,255,.02));padding:16px 18px;margin-bottom:9px;cursor:pointer;transition:.18s;display:flex;gap:14px;align-items:center” data-act=”goInst” data-id=”${r[1]}”>
        <div style=”width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,${r[3]},rgba(255,255,255,.1));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#1a1200;flex-shrink:0”>${r[1].split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
        <div style=”flex:1;min-width:0”>
          <div style=”display:flex;align-items:center;gap:8px;flex-wrap:wrap”>
            <span style=”font-size:14px;font-weight:800”>${r[1]}</span>
            <span class=”tag am” style=”font-size:9.5px”>🏛️ Institution</span>
            ${isVIT?'<span class=”tag gr” style=”font-size:9.5px”>✦ Verified · Level 2</span>':''}
          </div>
          <div style=”font-size:11.5px;color:var(--mut);margin-top:4px”>${r[2]}</div>
        </div>
        <div style=”flex-shrink:0;display:flex;gap:7px”>
          ${isVIT?'<button class=”btnP” style=”font-size:11.5px;padding:8px 14px” data-act=”goInst” data-id=”'+r[1]+'”>View Profile ↗</button>':''}
          <button class=”btnG” style=”font-size:11.5px;padding:8px 13px”>Follow</button>
        </div>
      </div>`;
    }).join('');
    out+='</div>';
  }
  if(rest.length){
    if(insts.length)out+=`<div style=”font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);margin-bottom:10px”>Other results</div>`;
    out+=rest.map(r=>`<div class=”row”><div class=”av” style=”background:${grad(r[3])}”>${ICO[r[0]]||'•'}</div><div style=”flex:1”><div class=”nm”>${r[1]} <span class=”tag gy” style=”margin-left:4px”>${r[0]}</span></div><div class=”mt”>${r[2]}</div></div><div class=”right”><button class=”btnXs”>Open</button></div></div>`).join('');
  }
  return out;
}

queue:()=>{const T=[['all','All'],['mine','My Queue'],['esc','Escalated'],['breach','Breaching SLA'],['done','Resolved']];const a=curTab('queue',T);
  let rows=S.queue;
  if(a==='mine')rows=rows.filter(q=>q.owner==='Dr. Anand');
  else if(a==='esc')rows=rows.filter(q=>q.state==='Escalated');
  else if(a==='breach')rows=rows.filter(q=>q.slaState==='breach'||q.slaState==='soon');
  else if(a==='done')rows=rows.filter(q=>q.state==='Resolved');
  const body=bulkBar('queue',[['Assign','assign'],['Escalate','escalate'],['Resolve','resolve'],['Export','export']])+
    tbl([chk('queue','__all'),'Work item','Type','Owner','SLA','State','Priority',''],rows.map(q=>
     `<tr><td>${chk('queue',q.id)}</td><td><b>${q.item}</b></td><td><span class="tag gy">${q.type}</span></td><td>${q.owner}</td><td>${slaTag(q.slaState)}</td><td>${stateTag(q.state)}</td><td>${priTag(q.pri)}</td><td>${q.state!=='Resolved'?`<button class="btnXs" data-act="escalateOne" data-id="${q.id}">Escalate</button> <button class="btnGr" data-act="resolveOne" data-id="${q.id}">Resolve</button>`:'<span class="tag gr">✓ done</span>'}</td></tr>`).join(''));
  return page('Workflow Queue','One queue for every approval, override, access request & case — with SLA timers, escalation states & bulk actions.',
   sae(['12 open items','5 unassigned across the team.'],['1 SLA breached, 2 due soon','Escalate the Acme Corp access request now.'],['Avg resolution 6.2h','Down from 11h after queue rollout.'])+
   tabs('queue',T)+body);},

cases:()=>{const T=[['open','Open'],['investigating','Investigating'],['intervention','Intervention'],['closed','Closed']];const a=curTab('cases',T);

function act(a,id,el){
  if(a==='sel'){const p=el.dataset.sel,cur=S.sel[p]||[];
    if(id==='__all'){const ids=S.queue.map(q=>q.id);S.sel[p]=cur.length>=ids.length?[]:ids;}
    else{const n=+id;S.sel[p]=cur.includes(n)?cur.filter(x=>x!==n):[...cur,n];}render();return;}
  if(a==='bulk'){const p=el.dataset.sel,bk=el.dataset.bk,picked=S.sel[p]||[],n=picked.length;
    if(bk==='resolve')S.queue.forEach(q=>{if(picked.includes(q.id))q.state='Resolved';});
    if(bk==='escalate')S.queue.forEach(q=>{if(picked.includes(q.id))q.state='Escalated';});
    if(bk!=='clear')flash({assign:n+' items assigned',escalate:n+' escalated',resolve:n+' resolved',export:n+' exported'}[bk]||'done');
    S.sel[p]=[];render();return;}
  id=id?+id:null;
  if(a==='drawer')studentDrawer(id);
  else if(a==='facDrawer')openDrawer('<div style="font-size:17px;font-weight:800;margin-bottom:14px">'+FAC[id][0]+'</div><div style="font-size:12px;color:var(--mut);margin-bottom:14px">'+FAC[id][1]+'</div><div class="grid g2">'+kpi(FAC[id][2],'Groups',C.purple)+kpi(FAC[id][3],'Tasks',C.gold)+'</div><div class="note" style="margin-top:14px">🔒 Earnings are private to the professor and not shown to the institution.</div>');
  else if(a==='driveDrawer')driveDrawer(id);
  else if(a==='groupDrawer')openDrawer('<div style="font-size:17px;font-weight:800;margin-bottom:14px">Group detail</div><div class="mt" style="font-size:12px;line-height:1.8">Owner · Purpose · Student count<br>Task feed · Document shelf<br>Session calendar · Activity timeline</div>');
  else if(a==='taskDrawer')openDrawer('<div style="font-size:17px;font-weight:800;margin-bottom:6px">LRU Cache — Design</div><div class="mt" style="font-size:12px;margin-bottom:14px">CSE 2025 · linked to Arena module</div><div class="grid g2">'+kpi('12%','Completion',C.am)+kpi('+60','ELO effect',C.blue)+'</div><div class="sec" style="margin:14px 0 8px"><h2 style="font-size:13px">Students stuck</h2></div><div class="mt" style="font-size:12px">9 students · suggest follow-up mentor session.</div>');
  else if(a==='appr'){const r=S.studentReqs.find(x=>x.id===id);S.studentReqs=S.studentReqs.filter(x=>x.id!==id);flash(r.name+' approved & linked');render();}
  else if(a==='rej'){S.studentReqs=S.studentReqs.filter(x=>x.id!==id);flash('Request rejected');render();}
  else if(a==='askfix'){flash('Correction requested from student');}

/* ===================== INSTITUTION PROFILE CANVAS ===================== */
function initInstPage(){
  // ---- Background canvas ----
  const cv=document.getElementById('ipCanvas');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  let W,H,DPR=Math.min(devicePixelRatio,2),t2=0;
  function rsz(){W=cv.offsetWidth;H=cv.offsetHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}rsz();
  const PTS=[];
  for(let i=0;i<120;i++)PTS.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,
    r:Math.random()<.15?2.5:Math.random()<.4?1.5:1,
    col:['#f6c453','#74a8ff','#4fd4a3','#ab93ff','#54d9e0'][Math.floor(Math.random()*5)],
    bright:Math.random()
  });
  function hx(col,a){const n=parseInt(col.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
  function loopBg(){
    if(!document.getElementById('ipCanvas'))return;
    t2++;ctx.clearRect(0,0,W,H);
    // grid
    ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=1;
    for(let i=0;i<W;i+=56){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    for(let i=0;i<H;i+=56){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
    // particles
    PTS.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      const pulse=p.bright*.4+.3+Math.sin(t2*.025+p.bright*6.28)*.25;
      // connections
      PTS.forEach(q=>{
        const d=Math.hypot(p.x-q.x,p.y-q.y);
        if(d<90&&d>1){ctx.strokeStyle=hx(p.col,(.9-d/90)*.10);ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
      });
      if(p.r>1.8){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,hx(p.col,pulse*.7));g.addColorStop(1,hx(p.col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,7);ctx.fill();}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=hx(p.col,pulse*.9);ctx.fill();
    });
    requestAnimationFrame(loopBg);
  }
  window.addEventListener('resize',()=>{rsz();PTS.forEach(p=>{p.x=Math.random()*W;p.y=Math.random()*H;});});
  loopBg();

  // ---- Orbit nodes ----
  const orbit=document.getElementById('ipOrbit');
  if(orbit){
    // Remove stale nodes
    orbit.querySelectorAll('.ip-orb-node').forEach(n=>n.remove());
    const CX=160,CY=160;
    const ONODES=[
      {angle:0,   r:82,  n:'2,400', l:'Students',  col:'#74a8ff'},
      {angle:180, r:82,  n:'64',    l:'Partners',   col:'#54d9e0'},
      {angle:75,  r:128, n:'₹6.2L', l:'Avg Pkg',   col:'#f6c453'},
      {angle:255, r:128, n:'#1',    l:'CSE Rank',  col:'#ab93ff'},
      {angle:330, r:152, n:'82',    l:'Trust',     col:'#4fd4a3'},
      {angle:150, r:152, n:'+141',  l:'ELO Lift',  col:'#dc8b18'},
    ];
    ONODES.forEach(o=>{
      const rad=o.angle*Math.PI/180;
      const px=CX+o.r*Math.cos(rad);
      const py=CY+o.r*Math.sin(rad);
      const el=document.createElement('div');
      el.className='ip-orb-node';
      el.style.cssText=`left:${px}px;top:${py}px;`;
      const hex=o.col;
      el.innerHTML=`<div class="on-chip" style="background:${hex}18;border-color:${hex}44;"><div class="on-n" style="color:${hex}">${o.n}</div><div class="on-l" style="color:${hex}">${o.l}</div></div>`;
      orbit.appendChild(el);
    });
    // Animate orbit spin via CSS on ring elements
    const r1=orbit.querySelector('.ip-ring2');
    const r2=orbit.querySelector('.ip-ring3');
    if(r1){r1.style.animation='orb2 18s linear infinite';}
    if(r2){r2.style.animation='orb3 28s linear infinite reverse';}
    if(!document.getElementById('orbKeyframes')){
      const s=document.createElement('style');s.id='orbKeyframes';
      s.textContent='@keyframes orb2{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes orb3{to{transform:translate(-50%,-50%) rotate(360deg)}}';
      document.head.appendChild(s);
    }
  }

  // ---- Ticker ----
  const track=document.getElementById('ipTickerTrack');
  if(track){
    const TICKS=[
      {col:'#4fd4a3',txt:'Riya Sharma → Google SDE-1 · ₹38L offered'},
      {col:'#f6c453',txt:'Google moved 12 CSE students to Round 2'},
      {col:'#74a8ff',txt:'ELO 1,542 — VIT\'s current platform high'},
      {col:'#ab93ff',txt:'Prof. Mehta published "LRU Cache Design" to 62 students'},
      {col:'#54d9e0',txt:'Flipkart shortlisted 92 students for SDE Intern'},
      {col:'#dc8b18',txt:'Zomato drive opened — 48h to apply'},
      {col:'#4fd4a3',txt:'3 offers logged today · avg ₹7.1L'},
      {col:'#ff8db1',txt:'System Design Recovery track: IT cohort +8% ready'},
      {col:'#f6c453',txt:'Annual Tech Fest 2026 — 4,000+ attendees'},
      {col:'#74a8ff',txt:'Stripe pipeline: 3 offer letters pending signatures'},
    ];
    const inner=TICKS.concat(TICKS).map(t=>`<span class="ip-tick-item"><span class="tid" style="background:${t.col}"></span>${t.txt}</span>`).join('');
    track.innerHTML=inner;
  }
}

/* ===================== TALENT MAP ===================== */
function initMap(){
  const cv=document.getElementById('tmap');if(!cv)return;
  const x=cv.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio,2),t=0,recr;
  const CLc=['#ab93ff','#4fd4a3','#74a8ff','#54d9e0','#ff8db1','#f6c453'];
  function rs(){W=cv.offsetWidth;H=cv.offsetHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
  rs();
  let cc=CLc.map((c,i)=>{const a=(i/6)*6.283-1.57;return{x:0,y:0,col:c,a};});
  function pos(){cc.forEach(o=>{o.x=W/2+Math.cos(o.a)*W*0.3;o.y=H/2+Math.sin(o.a)*H*0.3;});}pos();
  let nodes=[];for(let i=0;i<80;i++){const ci=i%6;nodes.push({ci,ang:Math.random()*6.28,rad:14+Math.random()*54,spd:(Math.random()*.4+.15)*(Math.random()<.5?1:-1)/100,jit:Math.random()*6.28,ready:Math.random()<.25,r:Math.random()<.25?5:3+Math.random()*2,strong:Math.random()<.4,x:0,y:0});}
  recr=[{a:0,sp:.0045,r:Math.min(W,H)*.4,t:2,co:'Google',c:'#4285F4'},{a:2,sp:.0058,r:Math.min(W,H)*.46,t:1,co:'Flipkart',c:'#F9A825'},{a:4,sp:.0037,r:Math.min(W,H)*.33,t:0,co:'Microsoft',c:'#7CBB00'}];
  function hx(h,a){const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
  function loop(){
    if(!document.getElementById('tmap'))return;
    t++;x.clearRect(0,0,W,H);
    x.strokeStyle='rgba(255,255,255,.025)';x.lineWidth=1;for(let i=0;i<W;i+=44){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}for(let i=0;i<H;i+=44){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
    cc.forEach(o=>{const g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,76);g.addColorStop(0,hx(o.col,.16));g.addColorStop(1,hx(o.col,0));x.fillStyle=g;x.beginPath();x.arc(o.x,o.y,76,0,7);x.fill();});
    nodes.forEach(n=>{const o=cc[n.ci];n.ang+=n.spd;const b=Math.sin(t*.02+n.jit)*4;n.x=o.x+Math.cos(n.ang)*(n.rad+b);n.y=o.y+Math.sin(n.ang)*(n.rad+b)*.82;if(n.strong){x.strokeStyle=hx(o.col,.09);x.beginPath();x.moveTo(n.x,n.y);x.lineTo(o.x,o.y);x.stroke();}});
    recr.forEach(r=>{r.a+=r.sp;const rx=W/2+Math.cos(r.a)*r.r,ry=H/2+Math.sin(r.a)*r.r*.7;x.strokeStyle=hx(r.c,.18);let cnt=0;nodes.forEach(n=>{if(n.ci===r.t&&n.strong&&cnt<5){x.beginPath();x.moveTo(rx,ry);x.lineTo(n.x,n.y);x.stroke();cnt++;}});x.beginPath();x.arc(rx,ry,8,0,7);x.fillStyle=hx(r.c,.9);x.fill();x.fillStyle='#fff';x.font='700 9px Inter';x.textAlign='center';x.fillText(r.co,rx,ry-13);});
    nodes.forEach(n=>{const c=CLc[n.ci];if(n.ready){const pr=5+Math.sin(t*.06+n.jit)*3;const g=x.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r+pr+5);g.addColorStop(0,hx(c,.5));g.addColorStop(1,hx(c,0));x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,n.r+pr+5,0,7);x.fill();}x.beginPath();x.arc(n.x,n.y,n.r,0,7);x.fillStyle=hx(c,n.strong?.95:.6);x.fill();});
    requestAnimationFrame(loop);
  }
  window.onresize=()=>{rs();pos();};loop();
  const caps=['Google is scanning the AI/ML cluster…','Flipkart shortlisted 6 Web students…','Microsoft is filtering DSA > 1450…'];
  let ci=0;clearInterval(window._cap);window._cap=setInterval(()=>{const lt=document.getElementById('livetxt');if(!lt)return;ci=(ci+1)%caps.length;lt.style.opacity=0;setTimeout(()=>{lt.textContent=caps[ci];lt.style.opacity=1;},250);},3400);
  const lt=document.getElementById('livetxt');if(lt)lt.style.transition='opacity .25s';
}
render();
</script>
