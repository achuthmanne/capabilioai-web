<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Capabilio · Institution OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#070600;--bg2:#0E0A02;--panel:#100B02;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);
  --amber:#D97706;--gold:#FBBF24;--green:#34D399;--blue:#60A5FA;--purple:#A78BFA;--cyan:#22D3EE;--pink:#F472B6;--red:#F87171;
  --txt:#F5F3EE;--mut:rgba(245,243,238,.6);--mut2:rgba(245,243,238,.38);
}
html,body{height:100%;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
.serif{font-family:'Playfair Display',serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px;}

#top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(7,6,0,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:relative;z-index:30;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.3px;}
.brand .mk{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,var(--amber),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:900;color:#1a1200;font-size:13px;}
.brand i{color:var(--gold);font-family:'Playfair Display',serif;font-style:italic;}
.brand .sep{width:1px;height:18px;background:var(--line2);margin:0 4px;}
.brand .ist{font-weight:600;font-size:13px;color:var(--mut);}
.roleSw{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:100px;padding:4px;}
.roleSw button{border:none;background:transparent;color:var(--mut);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:100px;display:flex;align-items:center;gap:6px;transition:.2s;}
.roleSw button.on{background:linear-gradient(135deg,var(--amber),var(--gold));color:#1a1200;}
.roleSw button:not(.on):hover{color:var(--txt);}
.who{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mut);}
.who .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#1a1200;}

#shell{display:flex;height:calc(100vh - 56px);}
#side{width:238px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;}
.sgrp{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--mut2);padding:14px 12px 7px;}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--mut);font-weight:600;margin-bottom:2px;transition:.15s;cursor:pointer;}
.nav .ic{width:18px;text-align:center;font-size:15px;}
.nav:hover{background:rgba(255,255,255,.04);color:var(--txt);}
.nav.on{background:rgba(217,119,6,.14);color:var(--gold);border:1px solid rgba(251,191,36,.25);}
.nav .bdg{margin-left:auto;font-size:10px;font-weight:800;background:var(--amber);color:#1a1200;border-radius:100px;padding:1px 7px;}
.sidecard{margin-top:16px;background:linear-gradient(135deg,rgba(217,119,6,.12),rgba(124,58,237,.06));border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:14px;}
.sidecard .t{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:5px;}
.sidecard .d{font-size:11px;color:var(--mut);line-height:1.5;}

#main{flex:1;overflow-y:auto;padding:22px 30px 60px;}
.scopebar{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--mut);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:100px;padding:8px 15px;margin-bottom:20px;width:fit-content;}
.scopebar b{color:var(--txt);font-weight:700;}
.scopebar .k{color:var(--gold);font-weight:800;}
.phead{margin-bottom:20px;}
.phead .kick{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--amber);text-transform:uppercase;}
.phead h1{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:6px;}
.phead p{color:var(--mut);font-size:13.5px;margin-top:5px;max-width:700px;}

.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;}
.card.hov{transition:transform .2s,border-color .2s;}.card.hov:hover{transform:translateY(-3px);border-color:rgba(251,191,36,.35);}
.stat .n{font-size:25px;font-weight:900;letter-spacing:-1px;}
.stat .l{font-size:11.5px;color:var(--mut);margin-top:3px;font-weight:600;}
.stat .d{font-size:10.5px;margin-top:7px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--green);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pl 1.8s infinite;}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.sec{margin:24px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.sec h2{font-size:16px;font-weight:800;}
.sec .sub{font-size:12px;color:var(--mut2);}
.btnP{padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--gold));color:#1a1200;font-weight:800;font-size:13px;border:none;box-shadow:0 5px 18px rgba(217,119,6,.3);}
.btnG{padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line2);color:var(--txt);font-weight:700;font-size:13px;}
.btnGr{padding:8px 14px;border-radius:9px;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.3);color:var(--green);font-weight:800;font-size:12px;}
.btnRd{padding:8px 14px;border-radius:9px;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);font-weight:800;font-size:12px;}
.btnXs{padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:800;border:1px solid var(--line2);background:var(--card);color:var(--txt);}

.row{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:9px;}
.row .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1a1200;flex-shrink:0;}
.row .nm{font-size:13.5px;font-weight:700;}
.row .mt{font-size:11px;color:var(--mut);}
.row .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tag{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:100px;}
.tag.am{background:rgba(217,119,6,.14);color:var(--gold);}.tag.gr{background:rgba(52,211,153,.14);color:var(--green);}
.tag.bl{background:rgba(96,165,250,.14);color:var(--blue);}.tag.pu{background:rgba(167,139,250,.14);color:var(--purple);}
.tag.pk{background:rgba(244,114,182,.14);color:var(--pink);}.tag.rd{background:rgba(248,113,113,.14);color:var(--red);}.tag.cy{background:rgba(34,211,238,.14);color:var(--cyan);}
.diff{font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;}
.diff.E{background:rgba(52,211,153,.15);color:var(--green);}.diff.M{background:rgba(251,191,36,.15);color:var(--gold);}.diff.H{background:rgba(248,113,113,.15);color:var(--red);}
.restrict{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--red);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28);border-radius:100px;padding:5px 12px;}
.privacy{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--mut2);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:100px;padding:5px 12px;}
.empty{text-align:center;padding:38px;color:var(--mut2);font-size:13px;border:1px dashed var(--line2);border-radius:14px;}

/* posts / pulse */
.post{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px;margin-bottom:13px;}
.post .ph{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.post .ph .av{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#1a1200;}
.post .ph .nm{font-size:13.5px;font-weight:800;}
.post .ph .mt{font-size:11px;color:var(--mut2);}
.post .ttl{font-size:14.5px;font-weight:800;margin-bottom:5px;}
.post .body{font-size:12.5px;color:var(--mut);line-height:1.6;}
.post .media{margin-top:12px;border-radius:12px;height:150px;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,rgba(217,119,6,.16),rgba(124,58,237,.12));border:1px solid var(--line);}
.post .doc{margin-top:12px;display:flex;align-items:center;gap:11px;padding:12px;border-radius:10px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.22);}
.post .doc .ic{font-size:22px;}.post .doc .dn{font-size:12.5px;font-weight:700;}.post .doc .ds{font-size:11px;color:var(--mut2);}
.post .pf{display:flex;gap:16px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut2);font-weight:600;}
.notif{display:flex;align-items:center;gap:11px;padding:11px 13px;border-left:2px solid var(--gold);background:rgba(217,119,6,.06);border-radius:0 10px 10px 0;margin-bottom:8px;font-size:12.5px;}
.notif .mt{margin-left:auto;font-size:11px;color:var(--mut2);}

#mapwrap{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#120c02,#070600 70%);height:360px;}
#tmap{position:absolute;inset:0;width:100%;height:100%;}
.maplg{position:absolute;left:14px;top:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:rgba(7,6,0,.55);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.maplg .lg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut);}.maplg .dot{width:8px;height:8px;border-radius:50%;}
.liveband{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:rgba(7,6,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(52,211,153,.3);border-radius:100px;padding:6px 13px;font-size:11.5px;color:var(--green);font-weight:700;}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar .nm{font-size:12px;width:120px;flex-shrink:0;}
.bar .tk{flex:1;height:9px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;}
.bar .fill{height:100%;border-radius:5px;}
.bar .pc{font-size:12px;font-weight:800;width:36px;text-align:right;}
.elo{display:flex;align-items:center;gap:18px;}
.eloRing{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);}
.eloRing .in{width:78px;height:78px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.eloRing .in b{font-size:22px;font-weight:900;color:var(--gold);}
.eloRing .in span{font-size:9px;color:var(--mut2);}

#mob{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
#mob.show{display:flex;}
#modal{width:470px;max-width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.7);}
#modal h3{font-size:18px;font-weight:800;margin-bottom:4px;}
#modal .ms{font-size:12.5px;color:var(--mut);margin-bottom:18px;}
.fld{margin-bottom:13px;}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13px;font-family:inherit;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);}
.frow{display:flex;gap:10px;}.frow .fld{flex:1;}
.uploadbox{border:1.5px dashed var(--line2);border-radius:11px;padding:20px;text-align:center;color:var(--mut2);font-size:12px;cursor:pointer;}
.uploadbox:hover{border-color:var(--gold);color:var(--gold);}
#modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.note{font-size:11px;color:var(--gold);background:rgba(217,119,6,.1);border:1px solid rgba(251,191,36,.25);border-radius:9px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
.flash{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#04231a;font-weight:800;font-size:13px;padding:12px 22px;border-radius:100px;z-index:80;opacity:0;transition:.3s;box-shadow:0 12px 40px rgba(52,211,153,.4);}
.flash.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr;}#side{width:200px;}}
</style>
</head>
<body>

<div id="top">
  <div class="brand"><span class="mk">C</span>Capabil<i>io</i><span class="sep"></span><span class="ist">🏛️ VIT Vellore</span></div>
  <div class="roleSw" id="roleSw">
    <button data-role="public" class="on">🌐 Public</button>
    <button data-role="admin">🛡️ Institution</button>
    <button data-role="prof">🎓 Professor</button>
    <button data-role="student">📚 Student</button>
  </div>
  <div class="who" id="who"></div>
</div>

<div id="shell">
  <div id="side"></div>
  <div id="main"></div>
</div>

<div id="mob"><div id="modal"></div></div>
<div class="flash" id="flash"></div>

<script>
/* ============================== STATE ============================== */
const C={am:'#D97706',gold:'#FBBF24',green:'#34D399',blue:'#60A5FA',purple:'#A78BFA',cyan:'#22D3EE',pink:'#F472B6'};
function av(s){return s.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function grad(c){return 'linear-gradient(135deg,'+c+',#FBBF24)';}

let S={
  role:'public', page:null, followed:false,
  who:{public:{n:'Visitor',c:C.blue},admin:{n:'Dr. Anand · Admin',c:C.am},prof:{n:'Prof. Mehta',c:C.purple},student:{n:'Riya Sharma',c:C.green}},
  // the logged-in student (their Arena activity auto-syncs to the institution Students tab)
  me:{name:'Riya Sharma',branch:'CSE',collegeId:'21BCE1188',elo:1342,arena:24},
  staff:[
    {id:1,name:'Prof. Mehta',dept:'CSE',role:'Professor',subject:'DSA & System Design',mentor:true,rate:799},
    {id:2,name:'Dr. Iyer',dept:'AI&DS',role:'HOD',subject:'AI / ML',mentor:true,rate:999},
    {id:3,name:'Prof. Nair',dept:'IT',role:'Assistant Prof.',subject:'Web Engineering',mentor:false,rate:0},
    {id:4,name:'Ms. Rao',dept:'CSE',role:'Placement Officer',subject:'Placement Cell',mentor:false,rate:0},
  ],
  // institution announcements posted by Admin — flow into Student & Professor Pulse
  posts:[
    {id:1,type:'text',title:'Google campus drive — Jun 28',body:'Eligibility: ELO > 1300. Register on Launchpad before Jun 25.',time:'2d',likes:156},
    {id:2,type:'doc',title:'Placement Report 2024–25',body:'Official NAAC-format placement brochure is now available.',doc:'placement-report-2025.pdf',time:'4d',likes:88},
    {id:3,type:'image',title:'Annual Tech Fest 2026 🎉',body:'Highlights from this year\'s fest — 4,000+ students, 30 events.',media:'🖼️',time:'1w',likes:214},
  ],
  external:[ // things a user follows OUTSIDE the institution — also appear in their Pulse
    {src:'GeeksforGeeks',ic:'🟢',txt:'New sheet: Top 50 DP problems for interviews',time:'3h'},
    {src:'Google Careers',ic:'🔵',txt:'STEP Internship applications now open',time:'6h'},
  ],
  studentReqs:[ // pending student join requests awaiting Admin approval
    {id:1,name:'Aman Verma',collegeId:'21BCE1042',branch:'CSE'},
    {id:2,name:'Neha Das',collegeId:'21BIT3090',branch:'IT'},
  ],
  groups:[
    {id:1,name:'CSE 2025 · DSA Sprint',prof:'Prof. Mehta',members:62,desc:'Daily DSA grind toward placement readiness.'},
    {id:2,name:'AI/ML Track',prof:'Dr. Iyer',members:48,desc:'ML fundamentals + interview prep.'},
  ],
  tasks:[ // tasks professors assign → student "My Tasks"
    {id:1,title:'Two Sum & Hashing Patterns',topic:'DSA',diff:'E',group:'CSE 2025 · DSA Sprint',due:'Jun 20',status:'done',elo:20},
    {id:2,title:'Binary Tree Traversals',topic:'DSA',diff:'M',group:'CSE 2025 · DSA Sprint',due:'Jun 22',status:'in_progress',elo:35},
    {id:3,title:'LRU Cache — Design',topic:'System Design',diff:'H',group:'CSE 2025 · DSA Sprint',due:'Jun 25',status:'todo',elo:60},
  ],
  docs:[ // notes/documents professors share to their groups
    {id:1,title:'DSA Patterns — Cheat Sheet.pdf',group:'CSE 2025 · DSA Sprint',prof:'Prof. Mehta'},
  ],
  arena:[ // Capabilio Arena problems (student path). Solving syncs to institution Students tab.
    {id:1,title:'Valid Parentheses',diff:'E',elo:15,done:true},
    {id:2,title:'Merge K Sorted Lists',diff:'H',elo:55,done:false},
    {id:3,title:'Course Schedule (Topo Sort)',diff:'M',elo:35,done:false},
    {id:4,title:'Word Ladder',diff:'H',elo:55,done:false},
  ],
  bookings:[ {id:1,student:'Arjun Nair',profId:1,slot:'Jun 21, 5:00 PM',topic:'FAANG interview strategy',status:'pending'} ],
  students:[ // institution roster (Riya = the logged-in "me", bound live)
    {name:'Arjun Nair',branch:'CSE',arena:31,elo:1489,placed:'Interviewing'},
    {name:'Sneha Patel',branch:'IT',arena:27,elo:1412,placed:'Placed · Microsoft'},
    {name:'Karthik R.',branch:'AI&DS',arena:14,elo:1388,placed:'Building'},
  ],
  placement:{rate:64,avg:'₹6.2L',high:'₹42L',recruiters:64,
    skills:[['DSA / CP',72,C.purple],['Web & Mobile',68,C.green],['Data / SQL',63,C.gold],['Communication',55,C.pink],['System Design',41,C.cyan]],
    locations:[['Bengaluru',128,C.gold],['Hyderabad',74,C.green],['Pune',39,C.blue],['Chennai',36,C.purple],['Remote',22,C.cyan],['Gurugram',13,C.pink]]},
};

/* ============================== NAV ============================== */
const NAV={
  public:[['profile','🏛️','Institution Profile'],['placement','📊','Live Placement Cell'],['feed','📰','Public Feed']],
  admin:[['ov','🛡️','Overview'],['posts','📣','Posts & Documents'],['reqs','✅','Student Approvals'],['students','📚','Students'],['staff','👥','Professors & Staff'],['placement','📊','Placement Cell'],['settings','⚙️','Settings']],
  prof:[['pdash','🎓','Dashboard'],['subjects','📘','My Subjects'],['ptasks','✅','Tasks & Notes'],['mentor','🗓️','Mentor Sessions'],['ppulse','📰','Pulse']],
  student:[['pulse','📰','Pulse'],['mytasks','✅','My Tasks'],['arena','⚔️','Arena'],['mentors','🧑‍🏫','Book a Mentor'],['progress','📈','ELO & Progress'],['career','🧭','Career Guidance']],
};
const FIRST={public:'profile',admin:'ov',prof:'pdash',student:'pulse'};
const SCOPE={
  admin:'🔐 <b>Institution Admin</b> · logged in to the <span class="k">Institution path</span> · full control · VIT Vellore',
  prof:'🔐 <b>Professor login</b> · app.capabilio.online · account created by Admin · scoped to <span class="k">your subjects + institution</span>',
  student:'🔐 <b>Student login</b> · College ID <b>21BCE1188</b> · verified & linked by Admin · VIT Vellore',
};

/* ============================== SHELL ============================== */
const $=s=>document.querySelector(s);
function setRole(r){S.role=r;S.page=FIRST[r];document.querySelectorAll('#roleSw button').forEach(b=>b.classList.toggle('on',b.dataset.role===r));render();}
document.getElementById('roleSw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setRole(b.dataset.role);});

function render(){
  const w=S.who[S.role];
  $('#who').innerHTML='<div class="av" style="background:'+grad(w.c)+'">'+av(w.n)+'</div>'+w.n;
  const pendingMentor=S.bookings.filter(b=>b.status==='pending').length;
  const todo=S.tasks.filter(t=>t.status!=='done').length;
  const reqs=S.studentReqs.length;
  const nav=NAV[S.role].map(([p,ic,lbl])=>{
    let bdg='';
    if(p==='mentor'&&pendingMentor)bdg='<span class="bdg">'+pendingMentor+'</span>';
    if(p==='mytasks'&&todo)bdg='<span class="bdg">'+todo+'</span>';
    if(p==='reqs'&&reqs)bdg='<span class="bdg">'+reqs+'</span>';
    return '<div class="nav '+(S.page===p?'on':'')+'" data-p="'+p+'"><span class="ic">'+ic+'</span>'+lbl+bdg+'</div>';
  }).join('');
  const scard={
    public:['A living institution','Students follow this page; recruiters scan it. Everything below is real-time.'],
    admin:['You run the institution','Post updates, approve students, manage professors. Staff creation is Admin-only.'],
    prof:['Scoped to you','You see only your subjects + institution news. Your earnings stay private to you.'],
    student:['Your whole campus','Tasks, Arena, mentors & institution updates — all in your Pulse.'],
  }[S.role];
  $('#side').innerHTML='<div class="sgrp">'+({public:'PUBLIC VIEW',admin:'INSTITUTION PATH',prof:'PROFESSOR PATH',student:'STUDENT PATH'}[S.role])+'</div>'+nav+
    '<div class="sidecard"><div class="t">'+scard[0]+'</div><div class="d">'+scard[1]+'</div></div>';
  $('#side').querySelectorAll('.nav').forEach(n=>n.onclick=()=>{S.page=n.dataset.p;render();});
  const scope=S.role!=='public'?'<div class="scopebar">'+SCOPE[S.role]+'</div>':'';
  $('#main').innerHTML=scope+((PAGES[S.page]||(()=>'<div class="empty">Coming soon</div>'))());
  if(S.page==='profile'||S.page==='placement')initMap();
  bindPage();
}

/* ============================== HELPERS ============================== */
function ph(kick,h,p){return '<div class="phead"><div class="kick">'+kick+'</div><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>';}
function stat(n,l,col,d){return '<div class="card stat"><div class="n" style="color:'+col+'">'+n+'</div><div class="l">'+l+'</div>'+(d?'<div class="d"><span class="pulse"></span> '+d+'</div>':'')+'</div>';}
function bars(arr){return arr.map(([n,p,c])=>'<div class="bar"><span class="nm">'+n+'</span><span class="tk"><span class="fill" style="width:'+p+'%;background:'+c+'"></span></span><span class="pc" style="color:'+c+'">'+p+'%</span></div>').join('');}
function flash(m){const f=$('#flash');f.textContent='✓ '+m;f.classList.add('show');clearTimeout(f._t);f._t=setTimeout(()=>f.classList.remove('show'),2200);}
function mapBlock(){return '<div id="mapwrap"><canvas id="tmap"></canvas>'+
  '<div class="maplg"><div class="lg"><span class="dot" style="background:#A78BFA"></span>DSA</div><div class="lg"><span class="dot" style="background:#34D399"></span>Web</div>'+
  '<div class="lg"><span class="dot" style="background:#60A5FA"></span>AI/ML</div><div class="lg"><span class="dot" style="background:#22D3EE"></span>Cloud</div>'+
  '<div class="lg"><span class="dot" style="background:#F472B6"></span>Design</div><div class="lg"><span class="dot" style="background:#FBBF24"></span>Data</div></div>'+
  '<div class="liveband"><span class="pulse"></span> <span id="livetxt">Google is scanning the AI/ML cluster…</span></div></div>';}

function postCard(p,canDelete){
  let media='';
  if(p.type==='image')media='<div class="media">'+(p.media||'🖼️')+'</div>';
  if(p.type==='doc')media='<div class="doc"><div class="ic">📄</div><div><div class="dn">'+p.doc+'</div><div class="ds">PDF document · tap to download</div></div></div>';
  return '<div class="post"><div class="ph"><div class="av" style="background:'+grad(C.am)+'">VIT</div>'+
    '<div><div class="nm">VIT Vellore <span style="color:var(--gold)">✦</span></div><div class="mt">Institution · '+p.time+' ago</div></div>'+
    (canDelete?'<div class="right" style="margin-left:auto"><button class="btnXs" data-act="delPost" data-id="'+p.id+'">Delete</button></div>':'')+'</div>'+
    '<div class="ttl">'+p.title+'</div><div class="body">'+p.body+'</div>'+media+
    '<div class="pf"><span>♥ '+p.likes+'</span><span>💬 Comment</span><span>↗ Share</span></div></div>';
}

/* ============================== MODALS / ACTIONS ============================== */
function openModal(html){$('#modal').innerHTML=html;$('#mob').classList.add('show');}
function closeModal(){$('#mob').classList.remove('show');}
$('#mob').addEventListener('click',e=>{if(e.target.id==='mob')closeModal();});
function bindPage(){
  $('#main').querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{S.page=el.dataset.p;render();});
  $('#main').querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>act(el.dataset.act,el.dataset.id));
}

function act(a,id){
  id=id?+id:null;
  if(a==='follow'){S.followed=!S.followed;flash(S.followed?'You now follow VIT Vellore':'Unfollowed');render();}

  else if(a==='addPost'){openModal(
    '<h3>Create Post</h3><div class="ms">Shared to your public profile + every linked student & professor Pulse.</div>'+
    '<div class="fld"><label>Type</label><select id="f_type"><option value="text">📣 Announcement</option><option value="image">🖼️ Image</option><option value="doc">📄 Document</option></select></div>'+
    '<div class="fld"><label>Title</label><input id="f_n" placeholder="Google campus drive — Jun 28"></div>'+
    '<div class="fld"><label>Body</label><textarea id="f_b" rows="2" placeholder="Details students need to know"></textarea></div>'+
    '<div class="fld" id="f_up"><label>Attachment</label><div class="uploadbox" onclick="document.getElementById(\'f_fake\').value=\'uploaded\';this.textContent=\'✓ file attached (demo)\'">⬆ Click to attach image / document</div><input type="hidden" id="f_fake"></div>'+
    '<div class="acts"><button class="btnG" data-x>Cancel</button><button class="btnP" data-save="post">Publish</button></div>');}

  else if(a==='delPost'){S.posts=S.posts.filter(p=>p.id!==id);flash('Post deleted');render();}

  else if(a==='appr'){const r=S.studentReqs.find(x=>x.id===id);S.students.unshift({name:r.name,branch:r.branch,arena:0,elo:1000,placed:'Building'});S.studentReqs=S.studentReqs.filter(x=>x.id!==id);flash(r.name+' approved & linked');render();}
  else if(a==='rej'){S.studentReqs=S.studentReqs.filter(x=>x.id!==id);flash('Request rejected');render();}

  else if(a==='addStaff'){openModal(
    '<h3>Add Professor / Staff</h3><div class="ms">Creates a login the staff member uses at app.capabilio.online.</div>'+
    '<div class="note">🛡️ Admin-only. They\'ll be scoped to their subject + institution news. Their earnings stay private to them.</div>'+
    '<div class="fld"><label>Full name</label><input id="f_n" placeholder="Prof. Sharma"></div>'+
    '<div class="frow"><div class="fld"><label>Department</label><input id="f_d" placeholder="CSE"></div>'+
    '<div class="fld"><label>Role</label><select id="f_r"><option>Professor</option><option>Assistant Prof.</option><option>HOD</option><option>Placement Officer</option></select></div></div>'+
    '<div class="fld"><label>Subject they teach</label><input id="f_s" placeholder="DSA & System Design"></div>'+
    '<div class="frow"><div class="fld"><label>Available as paid mentor?</label><select id="f_m"><option value="no">No</option><option value="yes">Yes</option></select></div>'+
    '<div class="fld"><label>Session rate (₹)</label><input id="f_rate" type="number" value="799"></div></div>'+
    '<div class="acts"><button class="btnG" data-x>Cancel</button><button class="btnP" data-save="staff">Create Account</button></div>');}
  else if(a==='rmStaff'){S.staff=S.staff.filter(s=>s.id!==id);flash('Staff member removed');render();}

  else if(a==='addGroup'){openModal(
    '<h3>Create Group</h3><div class="ms">Group students to assign tasks & notes at scale.</div>'+
    '<div class="fld"><label>Group name</label><input id="f_n" placeholder="CSE 2025 · DSA Sprint"></div>'+
    '<div class="fld"><label>Description</label><textarea id="f_d" rows="2"></textarea></div>'+
    '<div class="fld"><label>Starting members</label><input id="f_m" type="number" value="40"></div>'+
    '<div class="acts"><button class="btnG" data-x>Cancel</button><button class="btnP" data-save="group">Create</button></div>');}

  else if(a==='addTask'){openModal(
    '<h3>Assign Task</h3><div class="ms">Publishes instantly to every student in the group.</div>'+
    '<div class="fld"><label>Task title</label><input id="f_n" placeholder="LRU Cache — Design"></div>'+
    '<div class="frow"><div class="fld"><label>Topic</label><select id="f_t"><option>DSA</option><option>System Design</option><option>Web Dev</option><option>AI/ML</option></select></div>'+
    '<div class="fld"><label>Difficulty</label><select id="f_diff"><option value="E">Easy</option><option value="M" selected>Medium</option><option value="H">Hard</option></select></div></div>'+
    '<div class="frow"><div class="fld"><label>Group</label><select id="f_g">'+S.groups.map(g=>'<option>'+g.name+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>Due date</label><input id="f_due" placeholder="Jun 25"></div></div>'+
    '<div class="acts"><button class="btnG" data-x>Cancel</button><button class="btnP" data-save="task">Publish</button></div>');}

  else if(a==='addDoc'){openModal(
    '<h3>Share Note / Document</h3><div class="ms">Appears in the group for every student.</div>'+
    '<div class="fld"><label>Title</label><input id="f_n" placeholder="DSA Patterns — Cheat Sheet.pdf"></div>'+
    '<div class="fld"><label>Group</label><select id="f_g">'+S.groups.map(g=>'<option>'+g.name+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>Attachment</label><div class="uploadbox" onclick="document.getElementById(\'f_fake\').value=\'1\';this.textContent=\'✓ document attached (demo)\'">⬆ Click to attach PDF / notes</div><input type="hidden" id="f_fake"></div>'+
    '<div class="acts"><button class="btnG" data-x>Cancel</button><button class="btnP" data-save="doc">Share</button></div>');}

  else if(a==='book'){const m=S.staff.find(s=>s.id===id);openModal(
    '<h3>Book '+m.name+'</h3><div class="ms">'+m.subject+' · ₹'+m.rate+' / session</div>'+
    '<div class="note">💳 Paid 1:1 mentorship. The professor confirms your slot, then you meet for live career guidance.</div>'+
    '<div class="fld"><label>What do you want help with?</label><input id="f_topic" placeholder="FAANG interview strategy"></div>'+
    '<div class="fld"><label>Pick a slot</label><select id="f_slot"><option>Jun 21, 5:00 PM</option><option>Jun 22, 6:30 PM</option><option>Jun 24, 4:00 PM</option></select></div>'+
    '<div class="acts"><button class="btnG" data-x>Cancel</button><button class="btnP" data-save="book" data-id="'+id+'">Request Slot</button></div>');}

  else if(a==='acceptBk'){const b=S.bookings.find(x=>x.id===id);b.status='accepted';flash('Session confirmed with '+b.student);render();}
  else if(a==='declineBk'){const b=S.bookings.find(x=>x.id===id);b.status='declined';flash('Request declined');render();}
  else if(a==='start'){const t=S.tasks.find(x=>x.id===id);t.status='in_progress';flash('Task started — good luck!');render();}
  else if(a==='submit'){const t=S.tasks.find(x=>x.id===id);t.status='done';S.me.elo+=t.elo;flash('Task complete! +'+t.elo+' ELO');render();}
  else if(a==='solve'){const p=S.arena.find(x=>x.id===id);p.done=true;S.me.arena++;S.me.elo+=p.elo;flash('Solved! +'+p.elo+' ELO · synced to institution');render();}
}

document.addEventListener('click',e=>{
  if(e.target.matches('[data-x]'))closeModal();
  const sv=e.target.closest('[data-save]');if(!sv)return;
  const type=sv.dataset.save,g=id=>document.getElementById(id)?document.getElementById(id).value.trim():'';
  if(type==='post'){const n=g('f_n');if(!n)return flash('Enter a title');const ty=g('f_type');
    const p={id:Date.now(),type:ty,title:n,body:g('f_b')||'',time:'now',likes:0};
    if(ty==='image')p.media='🖼️';if(ty==='doc')p.doc=(g('f_n').toLowerCase().replace(/\s+/g,'-'))+'.pdf';
    S.posts.unshift(p);flash('Posted to profile & student Pulse');}
  else if(type==='staff'){const n=g('f_n');if(!n)return flash('Enter a name');const mentor=g('f_m')==='yes';
    S.staff.push({id:Date.now(),name:n,dept:g('f_d')||'CSE',role:g('f_r'),subject:g('f_s')||'—',mentor,rate:mentor?+g('f_rate')||799:0});flash('Professor account created');}
  else if(type==='group'){const n=g('f_n');if(!n)return flash('Enter a group name');
    S.groups.push({id:Date.now(),name:n,prof:'Prof. Mehta',members:+g('f_m')||0,desc:g('f_d')||''});flash('Group created');}
  else if(type==='task'){const n=g('f_n');if(!n)return flash('Enter a task title');const diff=g('f_diff');
    S.tasks.push({id:Date.now(),title:n,topic:g('f_t'),diff,group:g('f_g'),due:g('f_due')||'TBD',status:'todo',elo:diff==='H'?60:diff==='M'?35:20});flash('Task published to students');}
  else if(type==='doc'){const n=g('f_n');if(!n)return flash('Enter a title');
    S.docs.push({id:Date.now(),title:n,group:g('f_g'),prof:'Prof. Mehta'});flash('Note/document shared');}
  else if(type==='book'){const mid=+sv.dataset.id;
    S.bookings.push({id:Date.now(),student:S.me.name,profId:mid,slot:g('f_slot'),topic:g('f_topic')||'Career guidance',status:'pending'});flash('Slot requested — awaiting professor');}
  closeModal();render();
});

/* ============================== TALENT MAP ============================== */
function initMap(){
  const cv=document.getElementById('tmap');if(!cv)return;
  const x=cv.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio,2),t=0,recr;
  const CLc=['#A78BFA','#34D399','#60A5FA','#22D3EE','#F472B6','#FBBF24'];
  function rs(){W=cv.offsetWidth;H=cv.offsetHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
  rs();
  let cc=CLc.map((c,i)=>{const a=(i/6)*6.283-1.57;return{x:0,y:0,col:c,a};});
  function pos(){cc.forEach(o=>{o.x=W/2+Math.cos(o.a)*W*0.3;o.y=H/2+Math.sin(o.a)*H*0.3;});}
  pos();
  let nodes=[];for(let i=0;i<90;i++){const ci=i%6;nodes.push({ci,ang:Math.random()*6.28,rad:16+Math.random()*58,spd:(Math.random()*.4+.15)*(Math.random()<.5?1:-1)/100,jit:Math.random()*6.28,ready:Math.random()<.25,r:Math.random()<.25?5:3+Math.random()*2,strong:Math.random()<.4,x:0,y:0});}
  recr=[{a:0,sp:.0045,r:Math.min(W,H)*.4,t:2,co:'Google',c:'#4285F4'},{a:2,sp:.0058,r:Math.min(W,H)*.46,t:1,co:'Flipkart',c:'#F9A825'},{a:4,sp:.0037,r:Math.min(W,H)*.33,t:0,co:'Microsoft',c:'#7CBB00'}];
  function hx(h,a){const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
  function loop(){
    if(!document.getElementById('tmap'))return;
    t++;x.clearRect(0,0,W,H);
    x.strokeStyle='rgba(255,255,255,.025)';x.lineWidth=1;for(let i=0;i<W;i+=44){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}for(let i=0;i<H;i+=44){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
    cc.forEach(o=>{const g=x.createRadialGradient(o.x,o.y,0,o.x,o.y,78);g.addColorStop(0,hx(o.col,.16));g.addColorStop(1,hx(o.col,0));x.fillStyle=g;x.beginPath();x.arc(o.x,o.y,78,0,7);x.fill();});
    nodes.forEach(n=>{const o=cc[n.ci];n.ang+=n.spd;const b=Math.sin(t*.02+n.jit)*4;n.x=o.x+Math.cos(n.ang)*(n.rad+b);n.y=o.y+Math.sin(n.ang)*(n.rad+b)*.82;if(n.strong){x.strokeStyle=hx(o.col,.09);x.beginPath();x.moveTo(n.x,n.y);x.lineTo(o.x,o.y);x.stroke();}});
    recr.forEach(r=>{r.a+=r.sp;const rx=W/2+Math.cos(r.a)*r.r,ry=H/2+Math.sin(r.a)*r.r*.7;x.strokeStyle=hx(r.c,.18);let cnt=0;nodes.forEach(n=>{if(n.ci===r.t&&n.strong&&cnt<5){x.beginPath();x.moveTo(rx,ry);x.lineTo(n.x,n.y);x.stroke();cnt++;}});x.beginPath();x.arc(rx,ry,8,0,7);x.fillStyle=hx(r.c,.9);x.fill();x.fillStyle='#fff';x.font='700 9px Inter';x.textAlign='center';x.fillText(r.co,rx,ry-13);});
    nodes.forEach(n=>{const c=CLc[n.ci];if(n.ready){const pr=5+Math.sin(t*.06+n.jit)*3;const g=x.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r+pr+5);g.addColorStop(0,hx(c,.5));g.addColorStop(1,hx(c,0));x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,n.r+pr+5,0,7);x.fill();}x.beginPath();x.arc(n.x,n.y,n.r,0,7);x.fillStyle=hx(c,n.strong?.95:.6);x.fill();});
    requestAnimationFrame(loop);
  }
  window.onresize=()=>{rs();pos();};
  loop();
  const caps=['Google is scanning the AI/ML cluster…','Flipkart shortlisted 6 Web students…','Microsoft is filtering DSA > 1450…','24 verified profiles viewed this hour…'];
  let ci=0;clearInterval(window._cap);window._cap=setInterval(()=>{const lt=document.getElementById('livetxt');if(!lt)return;ci=(ci+1)%caps.length;lt.style.opacity=0;setTimeout(()=>{lt.textContent=caps[ci];lt.style.opacity=1;},250);},3400);
  const lt=document.getElementById('livetxt');if(lt)lt.style.transition='opacity .25s';
}

render();
</script>
