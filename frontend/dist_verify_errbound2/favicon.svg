<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background square (tabs clip to square anyway) -->
  <rect width="100" height="100" fill="#0D0D12"/>

  <!-- White C — a single stroked arc, not a hand-drawn serif path. Renders as
       a clean bold letterform at 16-32px; the old filled serif path had thin
       details that anti-aliased into a smudged circle at favicon size. -->
  <path d="M 70.68 34.64 A 27 27 0 1 0 70.68 69.36"
        fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round"/>

  <!-- Orange swoosh — one continuous stroke crossing the C's counter,
       matching the brand mark -->
  <path d="M 52 17 C 61 9, 79 13, 89 30 C 95 42, 93 55, 83 63"
        stroke="#FF5701" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Orange dot (period mark) -->
  <circle cx="72" cy="83" r="6.5" fill="#FF5701"/>
</svg>
